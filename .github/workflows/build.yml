name: Vérification frontend
on:
  push:
    branches: [main, tempus_V0.1]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - name: Conserver le frontend compilé
        uses: actions/upload-artifact@v4
        with:
          name: tempus-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
